# Production stack. Build and start from the repository root:
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Prerequisite: the secret files in deploy/secrets/ (see deploy/README.md).
#
# Only Caddy is published, and on 127.0.0.1 by default (PUBLISH_HOST). MongoDB and Kafka live on
# the internal `backend` network: no published port, no route out. The API is on both networks.
#
# Kafka is a three-broker KRaft cluster (each node broker and controller). Every listener is
# SASL_SSL: TLS with the deploy/secrets CA, SASL/PLAIN users from the JAAS secret, and the
# StandardAuthorizer denying anything without an ACL. Topics are replicated to all three brokers
# with min.insync.replicas=2, so one broker can be down without losing acknowledged events.
name: flight-delay-prod

x-app-env: &app-env
  NODE_ENV: production
  MONGODB_URI_FILE: /run/secrets/mongodb_uri
  MONGODB_DB: flight_delay
  PORT: '3001'
  KAFKA_BROKERS: kafka1:9092,kafka2:9092,kafka3:9092
  KAFKA_SECURITY_PROTOCOL: sasl_ssl
  KAFKA_SASL_USERNAME: flight_app
  KAFKA_SASL_PASSWORD_FILE: /run/secrets/kafka_app_password
  KAFKA_SSL_CA_FILE: /run/secrets/kafka_ca.crt

x-app-secrets: &app-secrets
  - mongodb_uri
  - kafka_app_password
  - kafka_ca.crt

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_APP_DB: flight_delay
      MONGO_APP_USER: flight_app
    secrets:
      - mongo_root_password
      - mongo_app_password
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      # ping needs no authentication.
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka1: &kafka
    image: apache/kafka:4.3.1
    environment: &kafka-env
      KAFKA_NODE_ID: 1
      CLUSTER_ID: rQzV4ISUQy-HAf9fC5j6Dg
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL_SSL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:SASL_SSL,SASL_SSL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      # SASL/PLAIN inside TLS for clients, brokers and controllers; users in the JAAS secret.
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf
      # TLS: the keystore holds the broker certificate (names kafka1..3); peers are verified
      # against the CA, including the hostname.
      KAFKA_SSL_KEYSTORE_FILENAME: broker.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/ca.crt
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      # Authorization: deny anything without an ACL; the brokers authenticate as admin.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: 'false'
      # Replication: every topic on all three brokers, two in sync for an acknowledged write.
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka1_data:/var/lib/kafka/data
      - ./secrets/kafka:/etc/kafka/secrets:ro
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server $$(hostname):9092 --command-config /etc/kafka/secrets/admin.properties > /dev/null 2>&1',
        ]
      # Each check starts a JVM (1-2 s of several cores), so steady state checks every 30 s;
      # start_interval keeps start-up detection quick.
      interval: 30s
      timeout: 20s
      retries: 6
      start_period: 90s
      start_interval: 5s
    hostname: kafka1
    restart: unless-stopped

  kafka2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka2:9092
    volumes:
      - kafka2_data:/var/lib/kafka/data
      - ./secrets/kafka:/etc/kafka/secrets:ro
    hostname: kafka2

  kafka3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka3:9092
    volumes:
      - kafka3_data:/var/lib/kafka/data
      - ./secrets/kafka:/etc/kafka/secrets:ro
    hostname: kafka3

  # One-shot: creates the topics (replication factor 3) and the app user's ACLs as admin, then
  # exits. Idempotent. The API and the consumer start after it.
  kafka-setup:
    image: apache/kafka:4.3.1
    entrypoint: ['bash', '/opt/setup/kafka-setup.sh']
    volumes:
      - ./kafka-setup.sh:/opt/setup/kafka-setup.sh:ro
      - ./secrets/kafka:/etc/kafka/secrets:ro
    networks:
      - backend
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    restart: 'no'

  api:
    image: flight-delay-api:local
    build: &api-build
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      TRUST_PROXY_HOPS: '1'
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
      PREDICT_RATE_LIMIT_PER_MIN: '30'
    secrets: *app-secrets
    networks:
      - backend
      - frontend
    depends_on:
      mongo:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    <<: *hardening
    restart: unless-stopped

  # The Kafka speed layer's consumer: stores and scores replayed flights.
  consumer:
    image: flight-delay-api:local
    build: *api-build
    command: ['node', '--enable-source-maps', 'server/dist/consume.js']
    environment: *app-env
    # No HTTP port: its liveness is the heartbeat /api/stream/status reports, and the restart
    # policy brings it back if it exits.
    healthcheck:
      disable: true
    secrets: *app-secrets
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    <<: *hardening
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: flight-delay-web:local
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost:8443}
      TLS_ISSUER: ${TLS_ISSUER:-internal}
    ports:
      - '${PUBLISH_HOST:-127.0.0.1}:${HTTPS_PORT:-8443}:8443'
      - '${PUBLISH_HOST:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Operations only, never started by `up` (profile `tools`): the build stage with the full source,
  # so any npm script can run against the stack, e.g.
  #   docker compose -f deploy/docker-compose.prod.yml run --rm tools stream:replay -- --month 12
  # The raw CSVs are mounted read-only for ingest and replay. It connects as the app user.
  tools:
    profiles: ['tools']
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: build
    image: flight-delay-tools:local
    entrypoint: ['npm', 'run']
    user: node
    environment: *app-env
    secrets: *app-secrets
    volumes:
      - ../data/raw:/app/data/raw:ro
    networks:
      - backend
    restart: 'no'

secrets:
  mongo_root_password:
    file: ./secrets/mongo_root_password
  mongo_app_password:
    file: ./secrets/mongo_app_password
  mongodb_uri:
    file: ./secrets/mongodb_uri
  kafka_app_password:
    file: ./secrets/kafka_app_password
  kafka_ca.crt:
    file: ./secrets/kafka_ca.crt

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  mongo_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  caddy_data:
  caddy_config:
