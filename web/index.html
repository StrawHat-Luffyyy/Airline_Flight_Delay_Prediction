    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          var descriptor = {
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          };
          try { Object.defineProperty(window, 'fetch', descriptor); } catch (e) {}
          try { Object.defineProperty(Window.prototype, 'fetch', descriptor); } catch (e) {}
        } catch (_) {}
      })();
    </script>
