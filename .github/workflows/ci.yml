name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The integration tests seed their own small databases (flight_delay_*_test) here;
      # without a reachable MongoDB they skip instead of running.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # Single-node KRaft broker, configured as in docker-compose.yml, for the broker integration
      # test (server/tests/stream/broker.integration.test.ts). It also skips without a broker.
      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
          KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail fast if the service is unreachable: the integration tests would otherwise skip silently.
      - name: Check MongoDB is reachable
        working-directory: server
        run: >-
          node -e "const { MongoClient } = require('mongodb');
          MongoClient.connect('mongodb://127.0.0.1:27017', { serverSelectionTimeoutMS: 30000 })
          .then(async (c) => { await c.db('admin').command({ ping: 1 }); await c.close(); console.log('mongo ok'); })
          .catch((e) => { console.error(e.message); process.exit(1); })"
      - name: Check Kafka is reachable
        working-directory: server
        run: >-
          node -e "const { KafkaJS } = require('@confluentinc/kafka-javascript');
          const admin = new KafkaJS.Kafka({ kafkaJS: { brokers: ['127.0.0.1:9092'] } }).admin();
          admin.connect().then(() => admin.listTopics({ timeout: 30000 }))
          .then(async () => { await admin.disconnect(); console.log('kafka ok'); })
          .catch((e) => { console.error(e.message); process.exit(1); })"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build -w @flight-delay/web
      # The production API bundle must build and boot: health answers from dist/server.js.
      - run: npm run build:server
      - name: Boot the production API bundle
        working-directory: server
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: flight_delay_ci_boot
          PORT: '3001'
          NODE_ENV: production
        run: |
          node dist/server.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health; then echo; kill %1; exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1
